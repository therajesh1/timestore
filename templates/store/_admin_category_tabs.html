<div class="filter-bar" style="margin-bottom:2rem;">
  <a href="{{ base_url }}" class="{% if not selected_category %}active{% endif %}">All</a>
  {% for value, label in categories %}
    <a href="{{ base_url }}?category={{ value|urlencode }}" class="{% if selected_category == value %}active{% endif %}">{{ label }}</a>
  {% endfor %}
</div>
