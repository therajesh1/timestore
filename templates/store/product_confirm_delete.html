{% extends "base.html" %}
{% block title %}Delete Product · The Time Store{% endblock %}
{% block content %}
<section class="section" style="max-width: 480px;">
  <p class="eyebrow"><span class="gold-line"></span>Admin</p>
  <h2 style="font-size: 2.5rem; margin-bottom: 1.5rem;">Delete <em>{{ product.name }}</em>?</h2>
  <div class="card-panel" style="margin-bottom: 2rem;">
    <p style="color: var(--muted-foreground);">This will permanently remove <strong style="color:var(--foreground);">{{ product.ref }} · {{ product.name }}</strong> from the catalog. This can't be undone.</p>
  </div>
  <form method="post" style="display:flex; gap:1rem;">
    {% csrf_token %}
    <button type="submit" class="btn" style="background:#B3261E; color:#fff;">Delete Permanently</button>
    <a href="{% url 'product_manage_list' %}" class="btn btn-outline">Cancel</a>
  </form>
</section>
{% endblock %}
