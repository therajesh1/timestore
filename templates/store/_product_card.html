<div class="product-card">
  <a href="{% url 'product_detail' product.pk %}" class="thumb">
    <img src="{{ product.display_image }}" alt="{{ product.name }}" />
  </a>
  <div class="info">
    <p class="tagline mono">{{ product.description|truncatechars:50 }}</p>
    <h3 class="name"><a href="{% url 'product_detail' product.pk %}">{{ product.name }}</a></h3>
    <p class="price mono">{{ product.formatted_price }}</p>
  </div>
</div>
